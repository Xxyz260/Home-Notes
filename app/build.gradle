plugins {
	id 'com.android.application'
}

def releaseSigningPropertiesFile = rootProject.file('signing.properties')
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.exists()) {
	releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
	['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { name ->
		if (!releaseSigningProperties.getProperty(name)?.trim()) {
			throw new GradleException("Missing ${name} in signing.properties")
		}
	}
}

android {
	namespace 'site.chatgpt.vi52.homenotes'
	compileSdk 37

	defaultConfig {
		applicationId 'site.chatgpt.vi52.homenotes'
		minSdk 29
		targetSdk 37
		versionCode 3
		versionName '1.2'
	}

	signingConfigs {
		release {
			if (releaseSigningPropertiesFile.exists()) {
				storeFile rootProject.file(releaseSigningProperties.getProperty('storeFile'))
				storePassword releaseSigningProperties.getProperty('storePassword')
				keyAlias releaseSigningProperties.getProperty('keyAlias')
				keyPassword releaseSigningProperties.getProperty('keyPassword')
				storeType 'PKCS12'
			}
		}
	}

	buildTypes {
		release {
			signingConfig signingConfigs.release
		}
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
}
